# Ollama: modelos locais na GTX 1660 (ADR 0003).
# Porta publicada só em localhost e na Tailscale; o gateway fala com ele pela rede "ia".
services:
  ollama:
    # 0.40.8, fixado por digest (ADR 0004)
    image: ollama/ollama@sha256:2b8eecdb85aa6ea67c381c8ecffec04b2658496cf2821a8f88b0485bdff198e8
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
      - "${TAILSCALE_IP:?defina TAILSCALE_IP no .env}:11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=10m
    networks: [ia]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama:

networks:
  ia:
    external: true
