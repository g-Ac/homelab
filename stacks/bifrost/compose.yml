# Bifrost: gateway único de IA (ADR 0004).
services:
  bifrost:
    # v2.3.1, fixado por digest; quarentena de 72 h cumprida (ADR 0004)
    image: maximhq/bifrost@sha256:fe323e244998e1a40b87be87f60d023746eae40dd69baae8f7f42728a5e16149
    container_name: bifrost
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "${TAILSCALE_IP:?defina TAILSCALE_IP no .env}:8080:8080"
    env_file: .env
    volumes:
      - ./config.json:/app/data/config.json:ro
      - bifrost-data:/app/data/store
    networks: [ia]
    depends_on: [sem-pensar]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  # Proxy entre o Bifrost e o Ollama: impõe reasoning_effort "none" quando o cliente não
  # escolhe (issue #13, ADR 0007). Só na rede "ia"; nenhuma porta publicada; sem segredo.
  sem-pensar:
    build: ./sem-pensar
    image: homelab/sem-pensar:local
    container_name: sem-pensar
    restart: unless-stopped
    environment:
      - SEM_PENSAR_UPSTREAM=http://ollama:11434
    networks: [ia]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  bifrost-data:

networks:
  ia:
    external: true
