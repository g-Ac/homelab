# Prometheus do homelab (roda no Pi, ADR 0006).
# Os alvos ficam em /etc/prometheus/alvos/*.yml, só no servidor; o repositório tem exemplos em alvos.exemplo/.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/regras/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels: { maquina: pi }

  - job_name: node
    file_sd_configs:
      - files: ["/etc/prometheus/alvos/node.yml"]

  - job_name: http
    metrics_path: /probe
    params: { module: [http_2xx] }
    file_sd_configs:
      - files: ["/etc/prometheus/alvos/http.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: alvo
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: blackbox
    static_configs:
      - targets: ["127.0.0.1:9115"]
        labels: { maquina: pi }
